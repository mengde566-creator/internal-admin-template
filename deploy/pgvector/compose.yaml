name: internal-admin-pgvector

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: internal-admin-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - internal-admin-pgvector-data:/var/lib/postgresql/data
    networks:
      - internal-admin-pgvector-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  internal-admin-pgvector-data:
    name: internal-admin-pgvector-data

networks:
  internal-admin-pgvector-network:
    name: internal-admin-pgvector-network
