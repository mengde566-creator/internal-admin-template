name: Database quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/openapi/package-lock.json
      - name: Install locked npm dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix tools/openapi
      - name: Run database quality gate
        run: ./scripts/quality.sh --database
